<!doctype html><html lang="pt"><head><meta charset="utf-8"><title>Ver elenco 15</title><style>body{margin:0;background:#2a3138}canvas{display:block}</style></head><body>
<script type="module">
import * as T from "three";
import {GLTFLoader} from "three/examples/jsm/loaders/GLTFLoader.js";
const g2=await new Promise((ok,ko)=>new GLTFLoader().load("/modelos/elenco15.glb",ok,undefined,ko));
const R=new T.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.outputColorSpace=T.SRGBColorSpace;R.setClearColor(0x2a3138);document.body.appendChild(R.domElement);
const sc=new T.Scene();sc.add(new T.HemisphereLight(0xffffff,0x556070,1.5));const dl=new T.DirectionalLight(0xffffff,2.2);dl.position.set(2,5,6);sc.add(dl);
sc.add(new T.Mesh(new T.PlaneGeometry(20,20).rotateX(-Math.PI/2),new T.MeshStandardMaterial({color:0x2e6b3a,roughness:1})));sc.add(g2.scene);
const cam=new T.PerspectiveCamera(32,innerWidth/innerHeight,.1,100);const mix=new T.AnimationMixer(g2.scene);
window.__v={R,sc,cam,g2,mix,T};
window.shot=(o)=>{o=o||{};mix.stopAllAction();if(o.anim){const c=g2.animations.find(a=>a.name===o.anim);mix.clipAction(c).play();mix.setTime(o.t||0)}else{mix.setTime(0)}
 g2.scene.updateMatrixWorld(true);
 if(o.i==null){cam.position.set(0,2.6,10.5);cam.lookAt(0,.95,0)}else{const p=new T.Vector3();g2.scene.children[o.i].getWorldPosition(p);const h=o.h||1.62;cam.position.set(p.x+(o.dx||0),h,p.z+(o.d||1.1));cam.lookAt(p.x,o.ly||h,p.z)}
 cam.fov=o.fov||(o.i==null?32:30);cam.updateProjectionMatrix();R.render(sc,cam)};
window.shot();window.__ready=1;
</script></body></html>
