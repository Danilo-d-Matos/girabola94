<style>
/* Layout: estádio à noite. Ecrãs empilhados (menu, escolha, pré-jogo, época, carreira, opções); o campo é um canvas centrado e o placard imita um painel de estádio. */
:root{
  --bg:#0d1f17; --panel:#132a20; --panel2:#1a3628; --line:#2a4a39;
  --fg:#eef2e8; --muted:#a3b8a8; --gold:#f2b705; --gold-ink:#1b1400; --red:#d7263d; --ok:#4cc38a;
  --f-display:"Rajdhani","Arial Narrow",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"Rajdhani","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
#app{padding-inline:16px;min-height:100%}
.screen{max-width:980px;margin:0 auto;padding-block:24px 40px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(20px,4vw,28px);letter-spacing:.01em}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-num);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:var(--gold)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{border:0;border-radius:6px;padding:12px 20px;font-weight:700;font-size:16px;background:var(--gold);color:var(--gold-ink);transition:transform .08s ease,filter .15s ease}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--muted)}
.btn.danger{background:var(--red);color:#fff}
.btn.small{padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--panel);border-radius:10px;padding:16px 18px;display:grid;gap:12px;min-width:0}
.panel-title{font-family:var(--f-num);text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--muted)}
.notice{background:rgba(215,38,61,.14);border-radius:8px;padding:10px 14px;font-size:14px}
.notice.info{background:rgba(242,183,5,.12)}
.note{font-size:13px;color:var(--muted);max-width:70ch}
kbd{font-family:var(--f-num);font-weight:700;background:var(--panel2);border-radius:4px;padding:1px 6px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35);white-space:nowrap}
.crest{flex:none;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.back{align-self:flex-start;border:0;background:none;color:var(--muted);font-weight:600;padding:4px 0;display:inline-flex;align-items:center;gap:6px}
.back svg{width:16px;height:16px}
.back:hover{color:var(--fg)}

/* Menu */
.hero{display:flex;flex-direction:column;gap:14px;padding-block:12px 4px}
.flagbar{display:grid;grid-template-rows:10px 10px;width:84px;border-radius:2px;overflow:hidden}
.flagbar i:first-child{background:var(--red)}
.flagbar i:last-child{background:#0b0b0b}
.title{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,10vw,84px);line-height:.92;letter-spacing:-.01em}
.title span{display:block;color:var(--gold);background:linear-gradient(100deg,var(--gold) 40%,#fff4c4 50%,var(--gold) 60%);background-size:260% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:glint 5s ease-in-out infinite}
@keyframes glint{0%,55%{background-position:100% 0}100%{background-position:0 0}}
.lede{font-size:18px;max-width:52ch;color:var(--muted)}
.kits{display:flex;flex-wrap:wrap;gap:6px}
.kit{display:block;transition:transform .2s ease}
.kit:hover{transform:translateY(-3px) rotate(-4deg)}
.menu-grid{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:720px){.menu-grid{grid-template-columns:1fr}}
.menu-actions{display:flex;flex-direction:column;gap:10px}
.menu-actions .btn{text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px}
.menu-actions .btn small{font-weight:600;opacity:.75;font-size:13px;text-align:right}
.seg{display:inline-flex;flex-wrap:wrap;border-radius:6px;box-shadow:inset 0 0 0 2px var(--line);padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:4px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--gold)}
.how{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.how h3{font-family:var(--f-num);font-size:15px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);margin-bottom:6px}
.how ul{margin:0;padding-left:18px;display:grid;gap:3px}
.first{background:linear-gradient(90deg,rgba(242,183,5,.16),rgba(242,183,5,.04));border-radius:10px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}

/* Escolher equipa */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.team{display:flex;align-items:center;gap:12px;text-align:left;border:0;border-radius:8px;padding:12px;background:var(--panel);min-width:0;transition:background .15s ease,transform .15s ease}
.team:hover:not(:disabled){background:var(--panel2);transform:translateY(-2px)}
.team:disabled{opacity:.35;cursor:not-allowed}
.team b{display:block;font-size:15px;line-height:1.2}
.team span{font-family:var(--f-num);font-weight:600;color:var(--muted);font-size:14px;letter-spacing:.04em}

/* Pré-jogo e época */
.versus{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.side b{font-size:16px;line-height:1.2}
.side small{font-family:var(--f-num);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.vs{font-family:var(--f-display);color:var(--gold);font-size:22px}
.opt{display:grid;gap:6px}
.opt .desc{font-size:13px;color:var(--muted);min-height:2.6em}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.hub-head{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.hub-team{display:flex;align-items:center;gap:14px;min-width:0}
.hub-team h2{font-size:clamp(20px,5vw,30px)}
.stats{display:flex;flex-wrap:wrap;gap:22px}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--f-num);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:720px){.cols{grid-template-columns:1fr}}
.tablewrap{overflow-x:auto;background:var(--panel);border-radius:10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th{font-family:var(--f-num);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--muted);text-align:right;padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;text-align:right;border-bottom:1px solid rgba(255,255,255,.04)}
.lt th:nth-child(2),.lt td:nth-child(2){text-align:left}
.lt td:first-child,.lt th:first-child{width:28px;text-align:center}
td.tm{display:flex;align-items:center;gap:8px;white-space:nowrap}
td.tm .crest{filter:none}
tr.me td{background:rgba(242,183,5,.12)}
tr.me td.tm{font-weight:700}
td.pts{font-weight:700}
.lt tr:first-child td:first-child{color:var(--gold);font-weight:700}
.results{display:grid;gap:4px}
.res{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;font-variant-numeric:tabular-nums;font-size:14px;padding:3px 0}
.res span:first-child{text-align:right}
.res b{font-family:var(--f-num);font-size:16px;min-width:44px;text-align:center}
.res.mine{color:var(--gold)}
.champ{background:linear-gradient(180deg,rgba(242,183,5,.18),transparent);border-radius:10px;padding:20px;display:grid;gap:10px}

/* Carreira */
.xpbar{height:10px;border-radius:5px;background:var(--panel2);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;border-radius:999px;padding:7px 14px;background:var(--panel2);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.chip:disabled{opacity:.5;cursor:not-allowed}
.chip i{width:12px;height:12px;border-radius:50%;display:inline-block}
.titles{display:flex;flex-wrap:wrap;gap:12px}
.titles div{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:8px;padding:6px 10px;font-variant-numeric:tabular-nums}

/* Opções */
.keys-table td,.keys-table th{text-align:left}
.keybtn{border:0;border-radius:6px;background:var(--panel2);padding:6px 10px;min-width:92px;font-family:var(--f-num);font-weight:700;letter-spacing:.03em}
.keybtn.wait{background:var(--gold);color:var(--gold-ink)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.toggle input{width:22px;height:22px;accent-color:var(--gold)}
textarea{width:100%;min-height:140px;box-sizing:border-box;background:#0a1711;border:1px solid var(--line);border-radius:6px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;resize:vertical}
input[type=file]{max-width:100%}

/* Jogo */
.match{position:fixed;inset:0;display:flex;flex-direction:column;background:#081510;padding:env(safe-area-inset-top,0px) max(12px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(12px,env(safe-area-inset-left,0px));z-index:5}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px;flex:none}
.icon{border:0;background:var(--panel);border-radius:6px;width:40px;height:36px;display:grid;place-items:center;font-weight:700;flex:none}
.icon svg{width:18px;height:18px}
.board{display:flex;align-items:stretch;border-radius:6px;overflow:hidden;background:#f4f1ea;color:#121212;box-shadow:0 2px 10px rgba(0,0,0,.35);font-variant-numeric:tabular-nums;min-width:0}
.board .tn{display:flex;align-items:center;gap:6px;padding:4px 8px;font-family:var(--f-num);font-weight:700;font-size:18px;letter-spacing:.04em}
.board .tn .crest{filter:none}
.board .sc{font-family:var(--f-display);font-size:22px;padding:2px 14px;background:linear-gradient(180deg,#d7263d,#9e1428);color:#fff;display:flex;align-items:center;white-space:nowrap;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.board .clk{font-family:var(--f-num);font-weight:700;font-size:17px;padding:4px 12px;background:#151515;color:var(--gold);display:flex;align-items:center;min-width:46px;justify-content:center}
.energy{display:flex;align-items:center;gap:6px;font-family:var(--f-num);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.energy .bar{width:64px;height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.energy .bar i{display:block;height:100%;width:100%;background:var(--ok);transition:width .1s linear}
.rightbar{display:flex;align-items:center;gap:10px}
@media (max-width:560px){.energy span{display:none}.energy .bar{width:44px}}
.stage{position:relative;flex:1;min-height:0;display:grid;place-items:center}
canvas{display:block;border-radius:6px;touch-action:none}
.keys{flex:none;text-align:center;font-size:13px;color:var(--muted);padding-block:6px 8px}
.touch{position:absolute;inset:0;pointer-events:none;z-index:2}
.joyzone{position:absolute;left:0;top:0;bottom:0;width:48%;pointer-events:auto;touch-action:none}
.joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);pointer-events:none}
.knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,255,255,.38)}
.joyhint{position:absolute;left:24px;bottom:24px;font-size:12px;color:rgba(255,255,255,.5);pointer-events:none}
.tbtns{position:absolute;right:8px;bottom:10px;width:232px;height:200px;pointer-events:none}
.tb{position:absolute;border-radius:50%;border:0;font-family:var(--f-num);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;touch-action:none;user-select:none;-webkit-user-select:none;pointer-events:auto;display:grid;place-items:center;line-height:1.05;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.tb.shoot{background:rgba(215,38,61,.88);color:#fff;width:92px;height:92px;right:4px;bottom:4px}
.tb.pass{background:rgba(242,183,5,.9);color:var(--gold-ink);width:72px;height:72px;right:104px;bottom:14px}
.tb.swap{background:rgba(255,255,255,.22);color:#fff;width:64px;height:64px;right:22px;bottom:110px}
.tb.sprint{background:rgba(76,195,138,.85);color:#06200f;width:68px;height:68px;right:110px;bottom:96px}
.tb.on{filter:brightness(1.3);transform:scale(.94)}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,12,8,.72);z-index:4;padding:12px;overflow:auto}
.card{background:var(--panel);border-radius:12px;padding:20px;display:grid;gap:14px;max-width:460px;width:100%;text-align:center;box-sizing:border-box}
.card h2{font-size:26px}
.bigscore{font-family:var(--f-display);font-size:42px;color:var(--gold);line-height:1}
.card .row{justify-content:center}
.mstats{width:100%;font-size:14px}
.mstats td{padding:5px 6px;border:0}
.mstats td:first-child{text-align:right;width:28%;font-weight:700}
.mstats td:nth-child(2){text-align:center;color:var(--muted);font-family:var(--f-num);letter-spacing:.06em;text-transform:uppercase;font-size:12px}
.mstats td:last-child{text-align:left;width:28%;font-weight:700}
.rotate{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:var(--panel);border-radius:6px;padding:6px 12px;font-size:13px;color:var(--muted);white-space:nowrap;pointer-events:none;z-index:3}
.skip{position:absolute;right:12px;top:12px;z-index:3}
.tutbox{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:min(560px,calc(100% - 24px));background:rgba(19,42,32,.94);border-radius:10px;padding:12px 14px;z-index:3;display:grid;gap:6px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.tutbox .row{justify-content:space-between}
.tutbox p{font-size:15px}
.dots{display:flex;gap:5px}
.dots i{width:18px;height:4px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--gold)}
@media (prefers-reduced-motion:reduce){.btn,.team,.kit{transition:none}.title span{animation:none}}
/* Jogador com a bola na barra superior */
.ball-player{min-width:0;flex:0 1 145px;display:flex;flex-direction:column;line-height:1.15;padding:0 7px;border-left:2px solid var(--gold);overflow:hidden}
.ball-player small{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ball-player strong{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .board{min-width:0}.topbar{gap:6px;flex-wrap:nowrap}
@media(max-width:560px){.ball-player{flex-basis:78px;padding:0 4px}.ball-player strong{font-size:11px}.ball-player small{font-size:8px}.topbar .rightbar{gap:4px}.topbar .board{gap:4px}.topbar .energy .bar{width:30px}.topbar .tn .crest{width:16px;height:16px}}

.board{background:linear-gradient(110deg,#f5f7f8 0%,#e8eef3 29%,#164e86 30%,#2473b0 69%,#e8eef3 70%,#f5f7f8 100%);border:1px solid #a4b2bf;border-radius:7px;box-shadow:0 2px 6px rgba(0,0,0,.25);padding:8px 12px;color:#12202f}
.board .sc{color:white;text-shadow:0 1px 2px #102e4c}.board .tn{color:#12202f}.board .clk{color:#12202f}

.stage{width:100%;overflow:hidden}.match .keys{padding:3px 10px;margin:2px auto;font-size:11px}.match canvas{border-radius:3px}

</style>
